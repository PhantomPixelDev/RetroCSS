<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Applies a stored theme choice before first paint. The stylesheet already
       follows prefers-color-scheme on its own, so this is only needed for the
       one case CSS cannot see: a visitor whose stored choice differs from their
       OS setting. Must stay inline and in <head> -- an external or deferred
       script runs too late to prevent the flash. -->
  <script>
    try {
      var retroTheme = localStorage.getItem('retro-theme');
      if (retroTheme) document.documentElement.setAttribute('data-theme', retroTheme);
    } catch (e) { /* storage blocked; prefers-color-scheme still applies */ }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form Example — RetroCSS</title>
  <meta name="description" content="A Windows 95/98 style login form built with RetroCSS, with bevelled inputs, checkboxes and buttons.">
  <link rel="canonical" href="https://phantompixeldev.github.io/RetroCSS/examples/login.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RetroCSS">
  <meta property="og:url" content="https://phantompixeldev.github.io/RetroCSS/examples/login.html">
  <meta property="og:title" content="Login Form Example — RetroCSS">
  <meta property="og:image" content="https://phantompixeldev.github.io/RetroCSS/images/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://phantompixeldev.github.io/RetroCSS/images/og-card.png">
  <meta property="og:description" content="A Windows 95/98 style login form built with RetroCSS, with bevelled inputs, checkboxes and buttons.">
  <link rel="stylesheet" href="../dist/retro.min.css">
  <style>
  .example-footer {
    margin-top: var(--retro-spacing-xl);
    padding-top: var(--retro-spacing-md);
    border-top: 1px solid var(--retro-border-medium);
    color: var(--retro-text-muted);
    font-size: var(--retro-font-size-sm);
    text-align: center;
  }

  </style>
</head>
<body class="retro-body-bg">
  <div class="retro-container">
    <nav class="retro-nav">
      <a href="../index.html" class="retro-nav-item" data-retro-tooltip="Home page">Home</a>
      <a href="../documentation.html" class="retro-nav-item" data-retro-tooltip="Documentation">Documentation</a>
      <a href="https://github.com/phantompixeldev/retrocss" class="retro-nav-item" data-retro-tooltip="GitHub">GitHub</a>
      <a href="index.html" class="retro-nav-item" data-retro-tooltip="Examples">Examples</a>
      <button class="retro-nav-item retro-theme-toggle" data-retro-tooltip="Toggle dark/light mode">Toggle Theme</button>
    </nav>
  </div>
  <hr class="retro-mt-5 retro-border-muted">
  <div class="retro-main-layout retro-gap-4">
    <div class="main-content retro-max-w-100 retro-mx-auto">
      <div class="retro-card retro-mt-8 retro-shadow-lg retro-border-2 retro-border-primary">
        <div class="retro-card-header retro-bg-primary retro-flex retro-items-center retro-gap-2"><h1>Login</h1></div>
        <div class="retro-card-content">
          <form class="retro-form" onsubmit="return false;">
            <div class="retro-form-group">
                            <input type="text" id="username" class="retro-input" placeholder="Username" required>
            </div>
            <div class="retro-form-group">
                            <input type="password" id="password" class="retro-input" placeholder="Password" required>
            </div>
            <div class="retro-form-group retro-flex retro-gap-2 retro-items-center">
              <label><input type="checkbox" class="retro-checkbox"> Remember me</label>
              <label><input type="checkbox" id="showpw" class="retro-checkbox" onchange="togglePassword()"> Show password</label>
            </div>
            <button class="retro-btn retro-btn-primary retro-w-full" type="submit">Login</button>
          </form>
          <div class="retro-divider retro-divider-dotted retro-my-4"></div>
          <div class="retro-text-center retro-mb-3 retro-text-secondary">or login with</div>
          <div class="retro-flex retro-gap-2 retro-justify-center retro-mb-4">
            <button class="retro-btn retro-btn-info retro-btn-xs">GitHub</button>
            <button class="retro-btn retro-btn-primary retro-btn-xs">Microsoft</button>
            <button class="retro-btn retro-btn-danger retro-btn-xs">Google</button>
          </div>
          <div class="retro-alert retro-alert-info retro-mt-4">Tip: Your credentials are case sensitive. <span class="retro-badge retro-badge-warning">Be careful!</span></div>
          <div class="retro-mt-4 retro-flex retro-gap-2">
            <a href="register.html" class="retro-btn retro-btn-sm">Register</a>
            <a href="#" class="retro-btn retro-btn-sm retro-btn-secondary">Forgot Password</a>
          </div>
        </div>
      </div>
      <footer class="example-footer">
        <p>
          A RetroCSS example &middot; <a href="index.html">All examples</a>
          &middot; <a href="../index.html">Components</a>
          &middot; <a href="../documentation.html">Docs</a>
          &middot; <a href="https://github.com/phantompixeldev/retrocss">GitHub</a>
        </p>
      </footer>

    </div>
    </div>
  <script src="../dist/retro.js"></script>
  <script>
    function togglePassword() {
      var pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
