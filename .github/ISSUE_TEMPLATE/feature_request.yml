name: Feature request
description: Propose a component, utility or token.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The interface problem, rather than the API you have in mind for it.
    validations: { required: true }

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Existing classes that nearly work, and where they stop.

  - type: input
    id: precedent
    attributes:
      label: Was there a Windows 9x equivalent?
      description: Not required, but it settles most design arguments here.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This can meet WCAG AA in both themes.
        - label: If it needs JavaScript, it can be operated by keyboard.
